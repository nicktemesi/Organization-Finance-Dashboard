{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-4">➕ Add Transaction</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Transaction</button>
        <a href="{% url 'transactions' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
