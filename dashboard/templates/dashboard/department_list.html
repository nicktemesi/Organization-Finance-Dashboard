{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">🏢 All Departments</h2>

    {% if departments %}
        <ul class="list-group">
            {% for dept in departments %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ dept.name }}
                    <a href="{% url 'department_detail' dept.id %}" class="btn btn-sm btn-outline-primary">View</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No departments available.</p>
    {% endif %}
</div>
{% endblock %}
