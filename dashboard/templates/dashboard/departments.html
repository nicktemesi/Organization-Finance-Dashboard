{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">📚 Department Accountant Dashboard</h2>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card border-info shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">View All Department Reports</h5>
                    <p class="card-text">Access and manage reports for every department.</p>
                    <a href="{% url 'all_reports' %}" class="btn btn-info">View Reports</a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card border-secondary shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Department List</h5>
                    <p class="card-text">Review department financial records and updates.</p>
                    <a href="{% url 'departments' %}" class="btn btn-secondary">View Departments</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
